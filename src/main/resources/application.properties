spring.application.name=ai-processor
server.port=${SERVER_PORT:8090}
server.error.include-message=always

# Keep secrets outside source control. Set these values through the environment or a secret store.
app.service-auth.shared-secret=${AI_PROCESSOR_SHARED_SECRET:}
app.service-auth.max-clock-skew-seconds=${AI_PROCESSOR_MAX_CLOCK_SKEW_SECONDS:60}
app.retail-backend.url=${RETAIL_BACKEND_URL:http://localhost:8080}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:75}

app.groq.api-key=${GROQ_API_KEY:}
app.openrouter.api-key=${OPENROUTER_API_KEY:}
app.gemini.api-key=${GEMINI_API_KEY:}
app.cloudflare.api-token=${CLOUDFLARE_API_TOKEN:}
app.cloudflare.account-id=${CLOUDFLARE_ACCOUNT_ID:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true

logging.level.com.retail.aiprocessor=${LOGGING_LEVEL_COM_RETAIL_AIPROCESSOR:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# The processor owns only the ai_processor schema in the shared retail database.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.datasource.url=${AI_PROCESSOR_DB_URL:${DB_URL:}}
spring.datasource.username=${AI_PROCESSOR_DB_USER:${DB_USER:}}
spring.datasource.password=${AI_PROCESSOR_DB_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS ai_processor

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=ai_processor
spring.flyway.schemas=ai_processor
